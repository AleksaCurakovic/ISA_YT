<div class="page">
  <div class="card">
    <h1 class="title">Login</h1>
    <p class="subtitle">Welcome back to <span class="brand">YouTubic</span>.</p>

    <form class="form">
      <label class="label">
        Username
        <input class="input" type="email" placeholder="Alex02" />
      </label>

      <label class="label">
        Password
        <input class="input" type="password" placeholder="••••••••" />
      </label>

      <button class="primary" type="button">Login</button>

      <p class="hint">
        Don’t have an account?
        <a class="link" routerLink="/register">Register</a>
      </p>
    </form>
  </div>
</div>
