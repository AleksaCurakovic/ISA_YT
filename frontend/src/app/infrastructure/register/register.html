<div class="page">
  <div class="card">
    <h1 class="title">Register</h1>
    <p class="subtitle">Create your <span class="brand">YouTubic</span> account.</p>

    <form class="form">
      <label class="label">
        Username
        <input class="input" type="text" placeholder="Alex02" />
      </label>

      <label class="label">
        Email
        <input class="input" type="email" placeholder="alex@example.com" />
      </label>

      <label class="label">
        Password
        <input class="input" type="password" placeholder="••••••••" />
      </label>

      <label class="label">
        Name
        <input class="input" type="password" placeholder="alex" />
      </label>

      <label class="label">
        Last Name
        <input class="input" type="password" placeholder="smith" />
      </label>

      <label class="label">
        Address
        <input class="input" type="password" placeholder="Street 123" />
      </label>

      <button class="primary" type="button">Register</button>

      <p class="hint">
        Already have an account?
        <a class="link" routerLink="/login">Login</a>
      </p>
    </form>
  </div>
</div>
