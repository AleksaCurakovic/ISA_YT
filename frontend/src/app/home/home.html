<div class="home">
  <div class="container">
    <div class="topbar">
      <h1 class="headline">Home</h1>
    </div>
    <div class="grid">
      <!-- CARD 1 -->
    @for (video of videoPreview(); track video.id) {
        <a class="card" (click)="playVideo(video.id)">

            <div class="thumb">
            <img
                class="thumb-img"
                [src]= "'http://localhost:8080' + video.thumbnailUrl"
                alt="thumbnail"
            />
            <span class="duration">{{ getDurationLabel(video.duration)}}</span>
            </div>

            <div class="meta">
            <div class="video-title">{{ video.title }}</div>

            <div class="sub">
                <span class="author">{{ video.author }}</span>
                <span class="dot">•</span>
                <span class="time">{{ video.createdAt | date:'MMM d, y, h:mm a' }}</span>
            </div>

            <div class="tags">
                <span class="tag">{{ video.tags }}</span>
            </div>
            </div>

        </a>
    }
    </div>
</div>
