<nav class="navbar">
  <div class="navbar-left">
    <a class="logo" routerLink="/">YouTubic</a>
  </div>

  <div class="navbar-right">
    @if (!this.loggedInUsername) {
      <a class="btn btn-outline" routerLink="/register">Register</a>
      <a class="btn btn-solid" routerLink="/login">Login</a>
    }
    @else{
      <a class="btn btn-solid" (click)="logout()">Logout</a>
    }
  </div>
</nav>
