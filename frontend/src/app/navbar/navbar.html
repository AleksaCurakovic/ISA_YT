<nav class="navbar">
  <div class="navbar-left">
    <a class="logo" routerLink="/">Jutjubić</a>
  </div>

  <div class="navbar-right">
    @if (!this.loggedInUsername) {
      <a class="btn btn-outline" routerLink="/register">Register</a>
      <a class="btn btn-solid" routerLink="/login">Login</a>
    }
    @else{
      <button class="btn btn-solid" (click)="createWatchParty()" [disabled]="(watchPartyServis.activePartySession$ | async)">Create Watch Party</button>
      <a class="btn btn-outline" routerLink="/upload">Upload video</a>
      <a class="btn btn-solid" (click)="logout()">Logout</a>
      <a class="username"  [routerLink]="['/profile']" [queryParams]="{ userName: loggedInUsername }">{{ loggedInUsername }}</a>
    }
  </div>
</nav>
